<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Water Intake Tracker</title>
<style>
body{font-family:Arial;background:#e0f2fe;text-align:center;padding:25px}
main{max-width:450px;margin:auto;background:white;padding:30px;border-radius:16px}
h2{font-size:35px;color:#0284c7}
button{background:#0284c7;color:white;border:0;padding:12px 16px;border-radius:8px;cursor:pointer;margin:5px}
input{padding:12px;width:85%;margin:10px}
</style>
</head>
<body>
<main>
<h1>Water Intake Tracker</h1>
<p>Track your daily water consumption.</p>
<h2 id="total">0 ml</h2>
<input id="amount" type="number" min="1" value="250">
<br>
<button onclick="addWater()">Add Water (ml)</button>
<button onclick="reset()">Reset</button>
</main>
<script>
const key="water-"+new Date().toLocaleDateString();
let water=Number(localStorage.getItem(key)||0);
function render(){
 document.getElementById("total").textContent=water+" ml";
 localStorage.setItem(key,water);
}
function addWater(){
 const amount=Number(document.getElementById("amount").value);
 if(amount<=0||!Number.isFinite(amount))return;
 water+=amount;
 render();
}
function reset(){
 water=0;
 render();
}
render();
</script>
</body>
</html>
